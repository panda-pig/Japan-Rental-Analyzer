{% extends "base.html" %}
{% block title %}物件分析{% endblock %}
{% block libs %}
<script defer src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" integrity="sha384-Mx5lkUEQPM1pOJCwFtUICyX45KNojXbkWdYhkKUKsbv391mavbfoAmONbzkgYPzR" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.3/src/wordcloud2.js" integrity="sha384-u5MoeP7iId/1yQx8f8/zcqsP99YhxCZvFoH6oeDF83VKVEr453M7FTJwkVy6b0Jo" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
{% endblock %}
{% block content %}
<h1 class="page-title">物件分析</h1>

<div class="card" style="margin-bottom:24px;">
  <p id="import-help" style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">
    物件詳細ページのURLを貼り付けてください。自動で解析し、エリア平均と比較します。
  </p>
  <div style="display:flex;gap:8px;">
    <label class="sr-only" for="import-url">物件詳細ページのURL</label>
    <input type="text" id="import-url" aria-describedby="import-help" placeholder="https://suumo.jp/chintai/jnc_xxxxx/ または https://www.homes.co.jp/chintai/room/..." style="flex:1;">
    <button class="btn btn-primary" id="import-btn" onclick="importAndAnalyze()">解析</button>
  </div>
  <div id="import-result" role="status" aria-live="polite" aria-atomic="true" style="margin-top:12px;font-size:13px;"></div>
</div>

<div id="analysis-container"></div>
{% endblock %}
{% block js %}my-list.js{% endblock %}
