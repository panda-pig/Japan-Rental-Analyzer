<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="賃貸物件のURLを貼るだけで、スコアリング・エリア相場比較・公的データ・駅の住民評価まで1枚のレポートに。東京・横浜の物件探し意思決定ツール。">
<title>{% block title %}Dashboard{% endblock %} - Japan Rental Analyzer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233E4F53'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='16' font-weight='600' fill='white' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}">

{% block libs %}{% endblock %}
</head>
<body>
{% set p = request.path %}
<a class="skip-link" href="#main">本文へスキップ</a>
<nav class="nav" aria-label="メインナビゲーション">
  <a class="nav-brand" href="/">
    <span class="nav-brand-icon">J</span>
    <span class="nav-brand-name">Japan Rental Analyzer</span>
  </a>
  <a class="nav-link{% if p == '/' %} active{% endif %}" href="/">エリアデータ</a>
  <a class="nav-link{% if p == '/my-list' %} active{% endif %}" href="/my-list">物件分析</a>
  <a class="nav-link{% if p == '/favorites' %} active{% endif %}" href="/favorites">お気に入り</a>
  <a class="nav-link{% if p == '/compare' %} active{% endif %}" href="/compare">比較</a>
  <a class="nav-link{% if p == '/settings' %} active{% endif %}" href="/settings">設定</a>
</nav>
<main class="container" id="main">
{% block content %}{% endblock %}
</main>
<script defer src="/static/js/{% block js %}{% endblock %}?v={{ asset_v }}"></script>
</body>
</html>
